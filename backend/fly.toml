app = "ddos-map-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  INGESTION_INTERVAL_SECONDS = "15"
  INGESTION_BATCH_SIZE = "5"
  MIN_REAL_EVENTS_PER_BATCH = "5"
  INVESTIGATION_THRESHOLD = "8.0"
  DEBUG = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/"
    timeout = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
