# Ruff configuration for DDoS Attack Visualizer Backend
# https://docs.astral.sh/ruff/configuration/

target-version = "py311"
line-length = 100

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "B904",   # raise without from (acceptable in error handlers)
    "ARG001", # unused function argument (common in FastAPI endpoints)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py are fine
"ml/*" = ["ARG001"]       # ML code may have unused args for interface consistency

[format]
quote-style = "double"
indent-style = "space"
