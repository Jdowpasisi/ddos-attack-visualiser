# Docker Compose for DDoS Attack Visualizer
# Run with: docker-compose up --build

version: '3.8'

services:
  # ============ PostgreSQL Database ============
  db:
    deploy:
      resources:
        limits:
          memory: 256M
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
      -c wal_buffers=4MB
    image: postgres:15-alpine
    container_name: ddos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: ddos_attack_map
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ddos_attack_map"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ddos-network

  # ============ FastAPI Backend ============
  backend:
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ddos-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Database connection (uses Docker service name 'db')
      DATABASE_URL: postgresql+asyncpg://postgres:pass@db:5432/ddos_attack_map
      
      # Application settings
      DEBUG: "false"
      LOG_LEVEL: INFO
      
      # Ingestion settings
      INGESTION_INTERVAL_SECONDS: ${INGESTION_INTERVAL_SECONDS:-5}
      INGESTION_BATCH_SIZE: "5"
      DISPLAY_RATE_PER_SECOND: ${DISPLAY_RATE_PER_SECOND:-3}
      MIN_REAL_EVENTS_PER_BATCH: ${MIN_REAL_EVENTS_PER_BATCH:-5}
      
      # Investigation threshold — trigger AI agent for events at or above this severity.
      # ML scores currently top out ~2.5; set to 2.3 to target only the highest-scoring events.
      INVESTIGATION_THRESHOLD: "2.3"
      INVESTIGATION_COOLDOWN_SECONDS: "15"
      
      # GROQ_API_KEY is loaded via env_file (backend/.env)
      # Geo service backend (ip-api for real coordinates)
      GEO_BACKEND: ip-api
      UVICORN_WORKERS: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - ddos-network

  # ============ React Frontend ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "3000:80"
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - ddos-network

# ============ Volumes ============
volumes:
  postgres_data:
    driver: local

# ============ Networks ============
networks:
  ddos-network:
    driver: bridge
